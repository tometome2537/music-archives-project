openapi: 3.1.1
info:
  title: api node tometome
  version: 1.0.0
servers:
  - url: https://api.node.tometome.giize.com
tags:
  - name: YouTube
paths:
  /v1/youtube/releases:
    get:
      tags:
        - YouTube
      summary: リリースされたアルバムのリストを返します。
      parameters:
        - name: channelid
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: YouTube releases
          content:
            application/json:
              schema:
                type: object
                properties:
                  releases:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        releaseId:
                          type: string
                        type:
                          type: string # To Do
                        title:
                          type: string
                        year:
                          type: integer
                        thumbnailUrl:
                          type: string

  /v1/youtube/release:
    get:
      tags:
        - YouTube
      summary: リリースされたアルバムのリストを返します。
      parameters:
        - name: releaseid
          in: query
          required: true
          example: "MPREb_QBTyp2wAmDf"
          schema:
            type: string
      responses:
        '200':
          description: YouTube releases
          content:
            application/json:
              schema:
                type: object
                properties:
                  release:
                    $ref: '#/components/schemas/youtubeReleases'
                  releaseItems:
                    type: array
                    items:
                      $ref: '#/components/schemas/youtubeRelease'
                  releaseItemsVideos:
                    type: array
                    items:
                      $ref: '#/components/schemas/youtubeVideo'

  /jwt/apple/music/{name}:
    get:
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string


components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "入力形式 → `token <token>`"

  schemas:
    youtubeReleases:
      type: object
      properties:
        id:
          type: string
        releaseId:
          type: string
        type:
          type: string # To Do
        title:
          type: string
        year:
          type: integer
        thumbnailUrl:
          type: string
        duration:
          type: integer
        artistChannelIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time

    youtubeRelease:
      type: object
      properties:
        id:
          type: string
        listIndex:
         type: integer
        title:
          type: string
        videoId:
          type: string
        duration:
          type: integer
        releaseVideoId:
          type: string
        playlistId:
          type: string

    youtubeVideo:
      type: object
      properties:
        id:
          type: string
        ownerChannelId:
          type: string
        channelId:
          type: string
        publishedAt:
          type: string
          format: date-time
        privacyStatus:
          type: string
        short:
          type: boolean
        musicType:
          type: string
        thumbnailUrl:
          type: string
        artistId:
          type: array
          items:
            type: string
        duration:
          type: integer
